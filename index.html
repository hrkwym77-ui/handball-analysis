<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ハンドボール試合分析</title>
</head>

<body>
  <h1>ハンドボール試合分析</h1>

  <p>試合時間：<span id="time">00:00</span></p>

  <button>試合開始</button>

  <h2>シュート入力</h2>

  <p>背番号</p>
  <select id="number">
  <option value="">背番号を選択</option>
  <option value="1">1</option>
  <option value="2">2</option>
  <option value="3">3</option>
  <option value="4">4</option>
  <option value="5">5</option>
  <option value="6">6</option>
  <option value="7">7</option>
  <option value="8">8</option>
  <option value="9">9</option>
  <option value="10">10</option>
  <option value="11">11</option>
  <option value="12">12</option>
  <option value="13">13</option>
  <option value="14">14</option>
  <option value="15">15</option>
  <option value="16">16</option>
  <option value="17">17</option>
  <option value="18">18</option>
  <option value="19">19</option>
  <option value="20">20</option>
</select>

  <p>シュート結果</p>
  <div>
  <button onclick="recordResult('成功')">入った</button>
  <button onclick="recordResult('失敗')">外れた</button>
</div>
<script>
  let seconds = 0;
  let shots = [];
  let timer = null;

  function startMatch() {
    if (timer !== null) return;

    timer = setInterval(() => {
      seconds++;

      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = seconds % 60;

      document.getElementById("time").textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(remainingSeconds).padStart(2, "0");
    }, 1000);
  }

  document.querySelector("button").onclick = startMatch;
</script>
</body>
</html>
