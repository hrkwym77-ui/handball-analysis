<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ハンドボール試合分析</title>
</head>

<body>
  <h1>ハンドボール試合分析</h1>

  <p>試合時間：<span id="time">00:00</span></p>

  <button>試合開始</button>

  <h2>シュート入力</h2>

  <p>背番号</p>
  <input type="number" placeholder="背番号">

  <p>シュート結果</p>
  <button>入った</button>
  <button>外れた</button>
<script>
  let seconds = 0;
  let timer = null;

  function startMatch() {
    if (timer !== null) return;

    timer = setInterval(() => {
      seconds++;

      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = seconds % 60;

      document.getElementById("time").textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(remainingSeconds).padStart(2, "0");
    }, 1000);
  }

  document.querySelector("button").onclick = startMatch;
</script>
</body>
</html>
