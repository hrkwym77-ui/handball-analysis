<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ハンドボール分析</title>
<style>
:root{--ink:#172b45;--muted:#718198;--line:#dce6ef;--panel:#f4f8fb;--blue:#1597ee;--green:#22ae75;--cyan:#17bfd3}
*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.app{max-width:1500px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(500px,1.15fr) minmax(470px,1fr);gap:16px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px #1a35510a;padding:16px;min-width:0}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:0 0 10px}.sub{color:var(--muted);font-size:12px}
.court-layout{display:grid;grid-template-columns:62px 1fr 62px;gap:8px;align-items:stretch}
.side{background:#e4edf5;border-radius:8px;display:flex;align-items:flex-start;justify-content:center;gap:7px;padding:14px 3px;flex-wrap:wrap;align-content:flex-start}
.player{border:0;border-radius:50%;width:28px;height:28px;background:var(--green);color:white;font-weight:800;cursor:pointer}
.player.blue{background:var(--blue)}.player.selected{outline:3px solid #ffc83d;outline-offset:2px}
.court{width:100%;height:auto;display:block;background:#fff;border:1px solid #d5e0e9;border-radius:6px;cursor:crosshair;touch-action:manipulation}
.hint{font-size:12px;color:var(--muted);margin:8px 0 14px}
.actions{display:grid;gap:11px}.action-group h3{font-size:13px;margin:0 0 6px}.buttons{display:flex;flex-wrap:wrap;gap:7px}
button.action{border:0;border-radius:8px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer;color:#123047;background:#e9f0f6}
button.action:hover,.player:hover{filter:brightness(.96);transform:translateY(-1px)}
.bluebg{background:#8ec7ff!important}.pink{background:#f5a2dc!important}.cyan{background:#32cadd!important}.yellow{background:#ffd84b!important}.orange{background:#ffb45d!important}.red{background:#ff5d5d!important;color:#fff!important}.greenbg{background:#83dfb8!important}.purple{background:#dfa1f1!important}
.score-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.timer{font-size:21px;font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:2px}.timer-controls{display:flex;gap:6px;margin-top:7px}.small{padding:5px 9px!important;font-size:12px!important}
.scoreline{display:grid;grid-template-columns:1fr auto auto auto 1fr;gap:12px;align-items:center;margin-bottom:14px}.team{border:0;color:white;border-radius:8px;padding:11px 8px;font-weight:800;background:var(--green);cursor:pointer}.team.b{background:var(--blue)}.score{font-size:28px;font-weight:850;font-variant-numeric:tabular-nums}.vs{color:var(--muted);font-weight:800}
.players-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.player-card{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;cursor:pointer;text-align:left;color:var(--ink)}.player-card.active{border:2px solid var(--blue);background:#f1f9ff;padding:9px}.player-name{font-weight:800;margin-bottom:8px}.num{display:inline-grid;place-items:center;background:var(--blue);color:white;border-radius:50%;width:25px;height:25px;margin-right:6px}.stat{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}.stat b{color:var(--ink)}
.section{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px}.ranking{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;text-align:center}.rank{border-right:1px solid var(--line);font-size:12px;padding:4px 0}.rank:last-child{border:0}.medal{font-size:18px}.rank strong{display:block;margin-top:5px}
.table-wrap{overflow:auto;max-height:280px}.history{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}.history th,.history td{border:1px solid var(--line);padding:6px;text-align:center}.history th{background:#f2f6fa;position:sticky;top:0}.tag{padding:3px 7px;border-radius:5px;background:#e6eef7;font-weight:700}.empty{text-align:center;padding:24px;color:var(--muted)}
@media(max-width:1000px){.app{grid-template-columns:1fr;padding:10px}.scoreline{gap:7px}.panel{padding:12px}}
@media(max-width:560px){.court-layout{grid-template-columns:42px 1fr 42px;gap:5px}.side{padding:8px 2px}.player{width:25px;height:25px}.players-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.scoreline{grid-template-columns:1fr auto auto auto 1fr}.team{font-size:12px;padding:9px 3px}.score{font-size:23px}.timer{font-size:18px}.action{flex:1 1 auto}}
</style>
</head>
<body>
<main class="app">
<section class="panel">
  <h1>コート・プレー記録</h1><div class="sub">選手番号を選択 → コート位置をクリック → プレーを記録</div>
  <div class="court-layout" style="margin-top:14px">
    <div class="side" id="aPlayers"><button class="player selected" data-player="1">1</button><button class="player" data-player="2">2</button><button class="player" data-player="3">3</button><button class="player" data-player="4">4</button></div>
    <svg id="court" class="court" viewBox="0 0 360 430" role="img" aria-label="ハンドボールコート">
      <rect x="104" y="12" width="152" height="64" fill="#e5edf4" stroke="#d5dfe7"/>
      <g stroke="#fff" stroke-width="7"><path d="M104 18h152M104 32h152M104 46h152M104 60h152"/></g>
      <rect x="112" y="18" width="136" height="54" fill="none" stroke="#66798b" stroke-width="2"/>
      <g stroke="#8293a2" stroke-width="1"><path d="M120 18v54M130 18v54M140 18v54M150 18v54M160 18v54M170 18v54M180 18v54M190 18v54M200 18v54M210 18v54M220 18v54M230 18v54M240 18v54M112 28h136M112 38h136M112 48h136M112 58h136"/></g>
      <rect x="35" y="80" width="290" height="330" fill="#fff" stroke="#111" stroke-width="3"/>
      <path d="M88 80 A92 92 0 0 0 272 80" fill="none" stroke="#111" stroke-width="3"/>
      <path d="M35 120 A145 145 0 0 0 325 120" fill="none" stroke="#111" stroke-width="3" stroke-dasharray="7 5"/>
      <path d="M35 190L95 128M325 190L265 128M55 300L145 190M305 300L215 190" fill="none" stroke="#0875d1" stroke-width="3"/>
      <path d="M172 164h16M168 202h24" stroke="#111" stroke-width="4"/>
      <g id="shots"></g>
    </svg>
    <div class="side" id="bPlayers"><button class="player blue" data-player="5">5</button><button class="player blue" data-player="6">6</button></div>
  </div>
  <div class="hint" id="selectionHint">選択中：Aチーム #1 ／ コートをクリックして位置を指定できます。</div>
  <div class="actions">
    <div class="action-group"><h3>[OF] 攻撃</h3><div class="buttons"><button class="action bluebg" data-event="セット">セット</button><button class="action pink" data-event="速攻">速攻</button></div></div>
    <div class="action-group"><h3>[ミス]</h3><div class="buttons"><button class="action cyan" data-event="パスミス">パス</button><button class="action cyan" data-event="キャッチミス">キャッチ</button><button class="action cyan" data-event="オーバー">オーバー</button><button class="action cyan" data-event="チャージ">チャージ</button><button class="action cyan" data-event="ダブル">ダブル</button><button class="action cyan" data-event="キック">キック</button><button class="action cyan" data-event="ブロック">ブロック</button><button class="action cyan" data-event="スロー">スロー</button></div></div>
    <div class="action-group"><h3>[罰則]</h3><div class="buttons"><button class="action yellow" data-event="警告">警告</button><button class="action orange" data-event="退場">退場</button><button class="action red" data-event="失格">失格</button></div></div>
    <div class="action-group"><h3>[その他]</h3><div class="buttons"><button class="action greenbg" data-event="タイムアウト">タイムアウト</button><button class="action purple" data-event="7mスロー">7mスロー</button><button class="action purple" data-event="7m獲得">7m獲得</button><button class="action" data-event="押し込み">押し込み</button><button class="action greenbg" data-event="得点">得点 +1</button><button class="action" data-event="セーブ">セーブ</button></div></div>
    <div class="buttons"><button class="action" id="undo">直前の記録を取り消す</button><button class="action" id="reset">試合データをリセット</button></div>
  </div>
</section>
<section class="panel">
  <div class="score-head"><div><h1>分析</h1><div class="sub">試合時間</div><div class="timer" id="timer">00:00:00</div><div class="timer-controls"><button class="action small" id="startTimer">▶ 開始</button><button class="action small" id="pauseTimer">Ⅱ 停止</button><button class="action small" id="resetTimer">リセット</button></div></div><div class="sub">HANDBALL<br>ANALYTICS</div></div>
  <div class="scoreline"><button class="team" id="teamA">Aチーム</button><span class="score" id="scoreA">0</span><span class="vs">VS</span><span class="score" id="scoreB">0</span><button class="team b" id="teamB">Bチーム</button></div>
  <h2>選手スタッツ（選択して記録対象を変更）</h2><div class="players-grid" id="playerCards"></div>
  <div class="section"><h2>🏆 得点ランキング</h2><div class="ranking" id="ranking"></div></div>
  <div class="section"><h2>◷ 入力履歴 <span class="sub" id="eventCount"></span></h2><div class="table-wrap"><table class="history"><thead><tr><th>時間</th><th>チーム</th><th>番号</th><th>プレー</th><th>位置</th><th>得点</th></tr></thead><tbody id="history"></tbody></table></div><div id="empty" class="empty">まだ記録がありません。中央のボタンから記録できます。</div></div>
</section>
</main>
<script>
const state={team:'A',player:1,scoreA:0,scoreB:0,events:[],shot:null,seconds:0,running:false};
const names={1:'選手 1',2:'選手 2',3:'選手 3',4:'選手 4',5:'選手 5',6:'選手 6'};
let timerInterval=null;
const $=id=>document.getElementById(id);
function timeText(sec){const h=String(Math.floor(sec/3600)).padStart(2,'0'),m=String(Math.floor(sec%3600/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');return `${h}:${m}:${s}`}
function selectPlayer(team,num){state.team=team;state.player=num;document.querySelectorAll('.player').forEach(b=>b.classList.toggle('selected',Number(b.dataset.player)===num));$('selectionHint').textContent=`選択中：${team}チーム #${num} ／ コートをクリックして位置を指定できます。`}
document.querySelectorAll('.player').forEach(b=>b.addEventListener('click',()=>selectPlayer(Number(b.dataset.player)<=4?'A':'B',Number(b.dataset.player))));
$('court').addEventListener('click',e=>{const r=$('court').getBoundingClientRect();const x=(e.clientX-r.left)/r.width*360,y=(e.clientY-r.top)/r.height*430;state.shot={x,y};const mark=document.createElementNS('http://www.w3.org/2000/svg','circle');mark.setAttribute('cx',x);mark.setAttribute('cy',y);mark.setAttribute('r',7);mark.setAttribute('fill',state.team==='A'?'#18ad75':'#1597ee');mark.setAttribute('stroke','#fff');mark.setAttribute('stroke-width',3);$('shots').appendChild(mark);$('selectionHint').textContent=`選択中：${state.team}チーム #${state.player} ／ 位置 (${Math.round(x)}, ${Math.round(y)})`});
function addEvent(type){const isGoal=type==='得点';const event={id:Date.now()+Math.random(),time:state.seconds,team:state.team,player:state.player,type,shot:state.shot?{...state.shot}:null,goal:isGoal?1:0};state.events.unshift(event);if(isGoal){if(state.team==='A')state.scoreA++;else state.scoreB++}render();state.shot=null}
document.querySelectorAll('[data-event]').forEach(b=>b.addEventListener('click',()=>addEvent(b.dataset.event)));
$('undo').addEventListener('click',()=>{const e=state.events.shift();if(e&&e.goal){if(e.team==='A')state.scoreA--;else state.scoreB--}render()});
$('reset').addEventListener('click',()=>{if(confirm('スコアと入力履歴をすべて消去しますか？')){state.events=[];state.scoreA=0;state.scoreB=0;$('shots').innerHTML='';state.shot=null;render()}});
$('teamA').addEventListener('click',()=>{state.team='A';selectPlayer('A',state.player<=4?state.player:1)});
$('teamB').addEventListener('click',()=>{state.team='B';selectPlayer('B',state.player>=5?state.player:5)});
function render(){
 $('scoreA').textContent=state.scoreA;$('scoreB').textContent=state.scoreB;$('timer').textContent=timeText(state.seconds);
 const stats={};for(let n=1;n<=6;n++)stats[n]={goals:0,shots:0};
 state.events.forEach(e=>{if(e.type==='得点'){stats[e.player].goals++;stats[e.player].shots++}else if(['シュート','7mスロー'].includes(e.type))stats[e.player].shots++});
 $('playerCards').innerHTML=Object.keys(names).map(n=>`<button class="player-card ${Number(n)===state.player?'active':''}" data-card="${n}"><div class="player-name"><span class="num">${n}</span>${names[n]} <span class="sub">${Number(n)<=4?'A':'B'}</span></div><div class="stat">得点 <b>${stats[n].goals}</b></div><div class="stat">シュート成功率 <b>${stats[n].shots?Math.round(stats[n].goals/stats[n].shots*100):'—'}${stats[n].shots?'%':''}</b></div></button>`).join('');
 document.querySelectorAll('[data-card]').forEach(b=>b.addEventListener('click',()=>selectPlayer(Number(b.dataset.card)<=4?'A':'B',Number(b.dataset.card))));
 const ranked=Object.entries(stats).sort((a,b)=>b[1].goals-a[1].goals||Number(a[0])-Number(b[0])).slice(0,5);
 $('ranking').innerHTML=ranked.map(([n,s],i)=>`<div class="rank"><div class="medal">${['🥇','🥈','🥉','4','5'][i]}</div><div>${names[n]}</div><strong>${s.goals}点</strong></div>`).join('');
 $('history').innerHTML=state.events.map(e=>`<tr><td>${timeText(e.time)}</td><td>${e.team}</td><td>${e.player}</td><td><span class="tag">${e.type}</span></td><td>${e.shot?`${Math.round(e.shot.x)}, ${Math.round(e.shot.y)}`:'—'}</td><td>${e.goal?'＋1':'—'}</td></tr>`).join('');
 $('empty').style.display=state.events.length?'none':'block';$('eventCount').textContent=`(${state.events.length}件)`;
}
$('startTimer').addEventListener('click',()=>{if(!state.running){state.running=true;timerInterval=setInterval(()=>{state.seconds++;$('timer').textContent=timeText(state.seconds)},1000)}});
$('pauseTimer').addEventListener('click',()=>{state.running=false;clearInterval(timerInterval)});
$('resetTimer').addEventListener('click',()=>{state.running=false;clearInterval(timerInterval);state.seconds=0;render()});
render();
</script>
</body>
</html>
