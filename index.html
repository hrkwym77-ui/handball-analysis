
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ハンドボール分析アプリ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header{background:#123b63;color:white;padding:18px;text-align:center}
header h1{margin:0;font-size:23px}
main{max-width:900px;margin:auto;padding:14px}
.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0000000c}
h2{font-size:18px;margin:0 0 12px}
input,select,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #cbd5e1}
input,select{max-width:100%}
button{background:#e2e8f0;color:#172033;cursor:pointer;border:0;font-weight:600}
button:active{transform:scale(.98)}
.primary{background:#1769aa;color:white}
.danger{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row input{flex:1;min-width:110px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.actions button{padding:13px 6px}
.small{font-size:13px;color:#64748b}
.score{font-size:38px;font-weight:800;text-align:center;margin:8px}
.timer{font-size:34px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 5px;border-bottom:1px solid #e2e8f0}
th{color:#64748b}
.scroll{overflow-x:auto}
#court{width:100%;max-height:360px;display:block;touch-action:manipulation}
#court circle{cursor:pointer}
.player-chip{display:inline-flex;align-items:center;gap:5px;background:#eaf3fc;padding:7px 10px;border-radius:20px;margin:3px}
.player-chip button{padding:2px 5px;background:transparent;color:#991b1b}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.statbox{background:#f1f5f9;border-radius:10px;padding:12px 5px;text-align:center}
.statbox strong{display:block;font-size:23px}
#history{padding-left:22px}
#history li{margin:8px 0}
@media(min-width:650px){.actions{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<h1>🤾 ハンドボール分析</h1>
<div class="small" style="color:#dbeafe">試合記録・シュート分析・選手ランキング</div>
</header>
<main>
<section class="card">
<h2>① 選手登録</h2>
<div class="row">
<input id="playerName" placeholder="選手名">
<input id="playerNumber" type="number" placeholder="背番号" style="max-width:100px">
<button class="primary" onclick="addPlayer()">選手を追加</button>
</div>
<div id="players" style="margin-top:10px"></div>
<p class="small">選手を選択してから、プレーを記録してね。</p>
</section>

<section class="card">
<h2>② 試合スコア</h2>
<div class="row" style="justify-content:center">
<div style="text-align:center;flex:1">
<div>自チーム</div><div class="score" id="ourScore">0</div>
</div>
<div style="font-size:25px">:</div>
<div style="text-align:center;flex:1">
<div>相手チーム</div><div class="score" id="oppScore">0</div>
</div>
</div>
<div class="row" style="justify-content:center">
<button class="primary" onclick="adjustScore('our',1)">自チーム +1</button>
<button onclick="adjustScore('our',-1)">自チーム −1</button>
<button onclick="adjustScore('opp',1)">相手 +1</button>
<button onclick="adjustScore('opp',-1)">相手 −1</button>
</div>
</section>

<section class="card">
<h2>③ 試合タイマー</h2>
<div class="timer" id="timer">30:00</div>
<div class="row" style="justify-content:center">
<button class="primary" id="timerToggle" onclick="toggleTimer()">▶ スタート</button>
<button onclick="resetTimer()">↺ 30分に戻す</button>
<input id="minutes" type="number" value="30" min="1" max="120" style="width:90px">
<button onclick="setTimer()">時間設定（分）</button>
</div>
</section>

<section class="card">
<h2>④ 選手・プレーを選択</h2>
<label for="selectedPlayer">記録する選手：</label>
<select id="selectedPlayer" style="width:100%;margin:8px 0">
<option value="">選手を登録してください</option>
</select>
<div class="actions">
<button class="success" onclick="record('goal')">⚽ シュート成功</button>
<button onclick="record('save')">🧤 シュート失敗・GKセーブ</button>
<button onclick="record('miss')">↗ シュートミス</button>
<button onclick="record('assist')">🤝 アシスト</button>
<button onclick="record('steal')">✋ スティール</button>
<button onclick="record('turnover')">❌ ミス・ターンオーバー</button>
<button onclick="record('block')">🛡 ブロック</button>
<button onclick="record('seven')">🎯 7mスロー獲得</button>
<button onclick="record('penalty')">🟨 退場・警告</button>
</div>
</section>


<section class="card">
  <h2>⑤ ゴール・シュートコース分析</h2>
  <p class="small">選手を選択し、ネット内の9エリアからシュート位置を選んでね。</p>

  <div id="realGoal" style="width:100%;max-width:600px;margin:20px auto">
    <svg id="goalSvg" viewBox="0 0 600 400"
         style="width:100%;display:block;touch-action:manipulation"
         role="img" aria-label="9分割ハンドボールゴール">

      <defs>
        <pattern id="netPattern" width="12" height="12"
                 patternUnits="userSpaceOnUse">
          <path d="M0 0 L12 12 M12 0 L0 12"
                stroke="#9ca3af" stroke-width="0.8" fill="none"/>
        </pattern>
      </defs>

      <!-- ゴールの奥とネット -->
      <rect x="55" y="45" width="490" height="310"
            fill="#e5e7eb"/>
      <rect x="55" y="45" width="490" height="310"
            fill="url(#netPattern)"/>

      <!-- 9つのシュートエリア -->
      <g id="goalZones"></g>

      <!-- ネットの境界 -->
      <rect x="55" y="45" width="490" height="310"
            fill="none" stroke="#374151" stroke-width="2"/>

      <!-- 赤白のゴール枠 -->
      <g id="goalFrame"></g>
    </svg>
  </div>

  <p id="goalSelection" style="text-align:center;font-weight:bold">
    シュート位置：未選択
  </p>

  <div class="actions">
    <button class="success" onclick="saveGoalShot('goal')">⚽ ゴール成功</button>
    <button onclick="saveGoalShot('save')">🧤 GKセーブ</button>
    <button onclick="saveGoalShot('miss')">↗ シュートミス</button>
  </div>
</section>

<script>
(() => {
  const svg = document.getElementById('goalSvg');
  const zones = document.getElementById('goalZones');
  const frame = document.getElementById('goalFrame');
  const info = document.getElementById('goalSelection');

  const NS = 'http://www.w3.org/2000/svg';
  let selected = null;

  // ネット内を3列×3行に分割
  const x0 = 55, y0 = 45, w = 490, h = 310;
  const cw = w / 3, ch = h / 3;

  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < 3; col++) {
      const index = row * 3 + col + 1;
      const rect = document.createElementNS(NS, 'rect');

      rect.setAttribute('x', x0 + col * cw);
      rect.setAttribute('y', y0 + row * ch);
      rect.setAttribute('width', cw);
      rect.setAttribute('height', ch);
      rect.setAttribute('fill', 'transparent');
      rect.setAttribute('stroke', '#374151');
      rect.setAttribute('stroke-width', '2');
      rect.style.cursor = 'pointer';
      rect.dataset.pos = index;

      rect.addEventListener('click', () => {
        selected = {
          index,
          name: ['左','中央','右'][col] +
                ['上','中','下'][row]
        };

        zones.querySelectorAll('.chosen')
          .forEach(el => el.classList.remove('chosen'));

        rect.classList.add('chosen');
        info.textContent =
          'シュート位置：' + selected.name +
          '（' + index + '番）';
      });

      zones.appendChild(rect);
    }
  }

  // 選択したエリアを青枠で表示
  const style = document.createElementNS(NS, 'style');
  style.textContent =
    '#goalZones .chosen { fill:rgba(22,119,255,.3); stroke:#1677ff; stroke-width:5; }';
  svg.appendChild(style);

  // ゴール枠を赤白交互に描画
  function stripe(x, y, width, height, vertical) {
    const count = 10;
    for (let i = 0; i < count; i++) {
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('fill', i % 2 === 0 ? '#e5252a' : '#ffffff');
      r.setAttribute('stroke', '#333333');
      r.setAttribute('stroke-width', '1');

      if (vertical) {
        r.setAttribute('x', x);
        r.setAttribute('y', y + height * i / count);
        r.setAttribute('width', width);
        r.setAttribute('height', height / count);
      } else {
        r.setAttribute('x', x + width * i / count);
        r.setAttribute('y', y);
        r.setAttribute('width', width / count);
        r.setAttribute('height', height);
      }
      frame.appendChild(r);
    }
  }

  // 左右のポストと上部クロスバー
  stripe(43, 35, 18, 330, true);
  stripe(539, 35, 18, 330, true);
  stripe(43, 35, 514, 20, false);

  // シュート位置と結果を既存の記録機能へ渡す
  window.saveGoalShot = function(type) {
    if (!selected) {
      alert('先にネット内のエリアを選んでね');
      return;
    }

    const playerId =
      Number(document.getElementById('selectedPlayer').value);

    if (!playerId) {
      alert('先に選手を選択してね');
      return;
    }

    record(type, {
      shotPosition: selected.name,
      shotZone: selected.index
    });

    selected = null;
    zones.querySelectorAll('.chosen')
      .forEach(el => el.classList.remove('chosen'));

    info.textContent = 'シュート位置：未選択';
  };
})();
</script>

<section class="card">
<h2>⑥ 選手別スタッツ</h2>
<div class="statgrid">
<div class="statbox"><strong id="totalShots">0</strong><span class="small">シュート数</span></div>
<div class="statbox"><strong id="totalGoals">0</strong><span class="small">得点</span></div>
<div class="statbox"><strong id="totalRate">0%</strong><span class="small">成功率</span></div>
</div>
<div class="scroll" style="margin-top:12px">
<table>
<thead><tr><th>選手</th><th>得点</th><th>試投</th><th>成功率</th><th>アシスト</th><th>ミス</th></tr></thead>
<tbody id="stats"></tbody>
</table>
</div>
</section>

<section class="card">
<h2>⑦ 得点ランキング</h2>
<div id="ranking" class="small">まだ記録がありません。</div>
</section>

<section class="card">
<h2>⑧ 試合履歴</h2>
<div class="row" style="margin-bottom:10px">
<button onclick="undo()" class="primary">↶ 直前の記録を取り消す</button>
<button onclick="exportCSV()">CSV出力</button>
<button onclick="resetMatch()" class="danger">試合記録をリセット</button>
</div>
<ol id="history"><li class="small">まだ記録がありません。</li></ol>
</section>
</main>
<script>
const state={players:[],events:[],our:0,opp:0,remaining:1800,running:false};
let tick=null;
let shotType='goal';
let shotPoints=[];
const names={goal:'シュート成功',save:'シュート失敗・GKセーブ',miss:'シュートミス',assist:'アシスト',steal:'スティール',turnover:'ミス・ターンオーバー',block:'ブロック',seven:'7mスロー獲得',penalty:'退場・警告'};
const $=id=>document.getElementById(id);

function addPlayer(){
 const name=$('playerName').value.trim();
 const number=$('playerNumber').value.trim();
 if(!name){alert('選手名を入力してね');return}
 if(state.players.some(p=>p.name===name)){alert('同じ名前の選手がいます');return}
 state.players.push({id:Date.now()+Math.random(),name,number,stats:{goal:0,save:0,miss:0,assist:0,steal:0,turnover:0,block:0,seven:0,penalty:0}});
 $('playerName').value='';$('playerNumber').value='';
 render();
}
function removePlayer(id){
 if(!confirm('この選手を削除しますか？過去の記録も集計対象から外れます。'))return;
 state.players=state.players.filter(p=>p.id!==id);
 render();
}
function renderPlayers(){
 $('players').innerHTML=state.players.map(p=>`<span class="player-chip">#${esc(p.number||'-')} ${esc(p.name)} <button onclick="removePlayer(${p.id})" aria-label="選手削除">×</button></span>`).join('')||'<span class="small">選手はまだ登録されていません。</span>';
 const old=$('selectedPlayer').value;
 $('selectedPlayer').innerHTML='<option value="">選手を選択</option>'+state.players.map(p=>`<option value="${p.id}">#${esc(p.number||'-')} ${esc(p.name)}</option>`).join('');
 if(state.players.some(p=>String(p.id)===old))$('selectedPlayer').value=old;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function record(type,extra={}){
 const id=Number($('selectedPlayer').value);
 const player=state.players.find(p=>p.id===id);
 if(!player){alert('先に選手を選択してね');return}
 const e={type,playerId:id,playerName:player.name,time:formatTime(),...extra};
 state.events.push(e);
 player.stats[type]=(player.stats[type]||0)+1;
 if(type==='goal')state.our++;
 render();
}
function adjustScore(team,amount){
 if(team==='our')state.our=Math.max(0,state.our+amount);
 else state.opp=Math.max(0,state.opp+amount);
 state.events.push({type:'score',team,amount,description:(team==='our'?'自チーム':'相手チーム')+'スコア '+(amount>0?'+':'')+amount,time:formatTime()});
 render();
}
function renderStats(){
 let shots=0,goals=0;
 state.players.forEach(p=>{shots+=p.stats.goal+p.stats.save+p.stats.miss;goals+=p.stats.goal});
 $('totalShots').textContent=shots;$('totalGoals').textContent=goals;
 $('totalRate').textContent=(shots?Math.round(goals/shots*100):0)+'%';
 $('stats').innerHTML=state.players.map(p=>{
 const s=p.stats,n=s.goal+s.save+s.miss;
 return `<tr><td>#${esc(p.number||'-')} ${esc(p.name)}</td><td>${s.goal}</td><td>${n}</td><td>${n?Math.round(s.goal/n*100):0}%</td><td>${s.assist}</td><td>${s.turnover}</td></tr>`;
 }).join('')||'<tr><td colspan="6">選手を登録してください</td></tr>';
 const sorted=[...state.players].sort((a,b)=>b.stats.goal-a.stats.goal);
 $('ranking').innerHTML=sorted.length?sorted.map((p,i)=>`${i+1}位　${esc(p.name)}：${p.stats.goal}得点`).join('<br>'):'まだ記録がありません。';
}
function renderHistory(){
 $('history').innerHTML=state.events.length?state.events.slice().reverse().slice(0,100).map(e=>{
 let desc=e.description||`${e.playerName}：${names[e.type]||e.type}`;
 if(e.type==='score')desc=e.description;
 if(e.type==='shot')desc=`${e.playerName}：位置記録（${e.shotType==='goal'?'成功':'失敗'}）`;
 return `<li>${esc(e.time)}　${esc(desc)}</li>`;
 }).join(''):'<li class="small">まだ記録がありません。</li>';
}
function render(){
 $('ourScore').textContent=state.our;$('oppScore').textContent=state.opp;
 renderPlayers();renderStats();renderHistory();drawMarks();updateTimer();
}
function undo(){
 const e=state.events.pop();
 if(!e){alert('取り消せる記録がありません');return}
 if(e.type==='score'){
 if(e.team==='our')state.our=Math.max(0,state.our-e.amount);
 else state.opp=Math.max(0,state.opp-e.amount);
 }else if(e.type==='shot'){
 shotPoints=shotPoints.filter(p=>p.eventId!==e.id);
 }else{
 const p=state.players.find(p=>p.id===e.playerId);
 if(p)p.stats[e.type]=Math.max(0,(p.stats[e.type]||0)-1);
 if(e.type==='goal')state.our=Math.max(0,state.our-1);
 }
 render();
}
function resetMatch(){
 if(!confirm('スコア、タイマー、すべての試合記録をリセットしますか？選手登録は残ります。'))return;
 pauseTimer();state.events=[];state.our=0;state.opp=0;state.remaining=1800;
 shotPoints=[];
 state.players.forEach(p=>Object.keys(p.stats).forEach(k=>p.stats[k]=0));
 render();
}
function formatTime(){return new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function updateTimer(){
 const m=Math.floor(state.remaining/60),s=state.remaining%60;
 $('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
 $('timerToggle').textContent=state.running?'⏸ 一時停止':'▶ スタート';
}
function toggleTimer(){
 if(state.running){pauseTimer();return}
 if(state.remaining<=0){alert('タイマーを設定し直してね');return}
 state.running=true;
 tick=setInterval(()=>{
 state.remaining=Math.max(0,state.remaining-1);
 updateTimer();
 if(state.remaining===0){pauseTimer();alert('試合時間終了！')}
 },1000);
 updateTimer();
}
function pauseTimer(){state.running=false;if(tick){clearInterval(tick);tick=null}updateTimer()}
function resetTimer(){pauseTimer();state.remaining=1800;updateTimer()}
function setTimer(){
 const m=Number($('minutes').value);
 if(!Number.isFinite(m)||m<1||m>120){alert('1〜120分で設定してね');return}
 pauseTimer();state.remaining=Math.round(m*60);updateTimer();
}
$('court').addEventListener('click',ev=>{
 const rect=$('court').getBoundingClientRect();
 const x=(ev.clientX-rect.left)/rect.width*600;
 const y=(ev.clientY-rect.top)/rect.height*330;
 const id=Number($('selectedPlayer').value);
 const p=state.players.find(p=>p.id===id);
 if(!p){alert('先に選手を選択してね');return}
 const e={id:Date.now()+Math.random(),type:'shot',shotType,playerId:id,playerName:p.name,x,y,time:formatTime()};
 state.events.push(e);shotPoints.push(e);render();
});
function setShotType(type){shotType=type;alert((type==='goal'?'成功':'失敗')+'位置の記録モードです。コートをタップしてね')}
function drawMarks(){
 $('shotMarks').innerHTML=shotPoints.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="7" fill="${p.shotType==='goal'?'#16a34a':'#dc2626'}" stroke="white" stroke-width="2"><title>${esc(p.playerName)}：${p.shotType==='goal'?'成功':'失敗'}</title></circle>`).join('');
}
function clearMarks(){shotPoints=[];$('shotMarks').innerHTML=''}
function exportCSV(){
 const rows=[['時刻','選手','プレー','詳細']];
 state.events.forEach(e=>rows.push([e.time,e.playerName||'',names[e.type]||e.type,e.description||'']));
 const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download='handball-analysis.csv';a.click();
 URL.revokeObjectURL(url);
}
render();
</script>
</body>
</html>
